<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="container">
    <header>
    <div class="bienvenida">
        <p>Hello, Welcome 👋</p>
        <h2>Johlver Pardo</h2>
    </div>

    <img src="" class="perfil">

    </header>
    <div class="buscar">
        <input type="text" placeholder="Search clothes...">
        <button class="filtrar">
        <img src="/storage/img/Main Icon.png" alt="">
        </button>
    </div>
     <div class="categorias">
        <button class="active">
        <img src="/storage/img/Default Icon.png">
        All Items
        </button>
        <button>
        <img src="/storage/img/Default Icon (1).png">
        Dress
        </button>
        <button>
        <img src="/storage/img/Default Icon (2).png">
        T-Shirt
        </button>
        <button>
        <img src="/storage/img/Default Icon (3).png">
        Jeans
        </button>
    </div>
    <div class="products">

    <div class="card">
    <img src="/storage/img/Library=Product1.png">
    <button class="corazon">
        <img src="/storage/img/Type=outline, Library=heart.png" alt="favorito">
    </button>
    <h4>Modern Light Clothes</h4>
    <p class="type">T-shirt</p>

    <div class="price">

    <span>$212.99</span>
    <span class="rating">⭐ 5.0</span>
    </div>
    </div>
    <div class="card">
    <img src="/storage/img/Library=Product2.png">
    <button class="corazon">
        <img src="/storage/img/Type=outline, Library=heart.png" alt="favorito">
    </button>
    <h4>Light Dress Bless</h4>
    <p class="type">Dress modern</p>
    <div class="price">
    <span>$162.99</span>
    <span class="rating">⭐ 5.0</span>
    </div>
    </div>
    <div class="card">
    <img src="/storage/img/Library=Product3.png">
    <button class="corazon">
        <img src="/storage/img/Type=outline, Library=heart.png" alt="favorito">
    </button>
    <h4>Summer Outfit</h4>
    <p class="type">T-shirt</p>
    <div class="price">
    <span>$110.99</span>
    <span class="rating">⭐ 4.8</span>
    </div>
    </div>
    <div class="card">
    <img src="/storage/img/Library=Product4.png">
    <button class="corazon">
        <img src="/storage/img/Type=outline, Library=heart.png" alt="favorito">
    </button>
    <h4>Modern Jacket</h4>
    <p class="type">Jacket</p>
    <div class="price">
    <span>$320.99</span>
    <span class="rating">⭐ 5.0</span>
    </div>
    </div>
    </div>
